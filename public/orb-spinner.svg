<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <style>
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spin-reverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.8); opacity: 0.8; }
    }
    .outer {
      transform-origin: center;
      animation: spin 3s linear infinite;
    }
    .inner {
      transform-origin: center;
      animation: spin-reverse 2s linear infinite;
    }
    .core {
      transform-origin: center;
      animation: pulse 2s ease-in-out infinite;
    }
  </style>
  
  <!-- Outer Ring -->
  <!-- Base ring with low opacity -->
  <circle cx="50" cy="50" r="44" stroke="#3cfba2" stroke-width="4" stroke-opacity="0.1" />
  <!-- Rotating segments (approx 2 segments) -->
  <circle cx="50" cy="50" r="44" stroke="#3cfba2" stroke-width="4" stroke-dasharray="70 71" stroke-linecap="round" class="outer" />
  
  <!-- Inner Ring -->
  <!-- Base ring with low opacity -->
  <circle cx="50" cy="50" r="32" stroke="#3cfba2" stroke-width="4" stroke-opacity="0.1" />
  <!-- Rotating segments (approx 2 segments) -->
  <circle cx="50" cy="50" r="32" stroke="#3cfba2" stroke-width="4" stroke-dasharray="50 50" stroke-linecap="round" class="inner" />
  
  <!-- Core -->
  <circle cx="50" cy="50" r="10" fill="#3cfba2" class="core">
     <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite" />
  </circle>
  
  <!-- Glow Effect (Optional, might not render perfectly in all contexts but good for SVG support) -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
