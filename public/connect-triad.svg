<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="#3cfba2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Three nodes forming a triangle -->
  <circle cx="50" cy="20" r="8" fill="#3cfba2" stroke="none" />
  <circle cx="20" cy="80" r="8" fill="#3cfba2" stroke="none" />
  <circle cx="80" cy="80" r="8" fill="#3cfba2" stroke="none" />
  
  <!-- Connecting lines -->
  <path d="M50 20 L 20 80" />
  <path d="M50 20 L 80 80" />
  <path d="M20 80 L 80 80" />
  
  <!-- Central connection point (optional, implies unity) -->
  <circle cx="50" cy="60" r="4" fill="#3cfba2" stroke="none" opacity="0.5" />
</svg>
