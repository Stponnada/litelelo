<svg width="512" height="350" viewBox="0 0 512 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Body Gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a4a4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2b2b2b;stop-opacity:1" />
    </linearGradient>
    <!-- Stick Gradient -->
    <radialGradient id="stickGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#111;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000;stop-opacity:1" />
    </radialGradient>
    <!-- Button Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Top Triggers/Bumpers (Background) -->
  <path d="M100,60 L412,60 C425,60 440,70 440,90 L72,90 C72,70 87,60 100,60 Z" fill="#1a1a1a"/>

  <!-- Main Controller Body -->
  <path d="M120,70 
           C70,70 40,120 40,190 
           C40,260 70,320 110,320 
           C135,320 155,300 256,280 
           C357,300 377,320 402,320 
           C442,320 472,260 472,190 
           C472,120 442,70 392,70 
           Z" 
        fill="url(#bodyGrad)" stroke="#1f1f1f" stroke-width="2"/>

  <!-- D-Pad (Bottom Left area relative to stick) -->
  <g transform="translate(180, 200)">
    <path d="M-15,-5 L-5,-5 L-5,-15 L5,-15 L5,-5 L15,-5 L15,5 L5,5 L5,15 L-5,15 L-5,5 L-15,5 Z" fill="#111" stroke="#333" stroke-width="1"/>
    <!-- D-pad Gloss -->
    <circle cx="0" cy="0" r="8" fill="#222" opacity="0.5"/>
  </g>

  <!-- Left Thumbstick (Top Left) -->
  <g transform="translate(130, 140)">
    <circle cx="0" cy="0" r="28" fill="#1a1a1a" />
    <circle cx="0" cy="0" r="22" fill="url(#stickGrad)" stroke="#333" stroke-width="2"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#222" stroke-width="1" stroke-dasharray="2,2"/>
  </g>

  <!-- Right Thumbstick (Bottom Right) -->
  <g transform="translate(330, 200)">
    <circle cx="0" cy="0" r="28" fill="#1a1a1a" />
    <circle cx="0" cy="0" r="22" fill="url(#stickGrad)" stroke="#333" stroke-width="2"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#222" stroke-width="1" stroke-dasharray="2,2"/>
  </g>

  <!-- ABXY Buttons (Top Right) -->
  <g font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle" alignment-baseline="middle" font-size="14">
    <!-- Y Button (Yellow/Top) -->
    <circle cx="380" cy="120" r="12" fill="#111" stroke="#f1c40f" stroke-width="2"/>
    <text x="380" y="125" fill="#f1c40f">Y</text>
    
    <!-- X Button (Blue/Left) -->
    <circle cx="350" cy="150" r="12" fill="#111" stroke="#3498db" stroke-width="2"/>
    <text x="350" y="155" fill="#3498db">X</text>
    
    <!-- B Button (Red/Right) -->
    <circle cx="410" cy="150" r="12" fill="#111" stroke="#e74c3c" stroke-width="2"/>
    <text x="410" y="155" fill="#e74c3c">B</text>
    
    <!-- A Button (Green/Bottom) -->
    <circle cx="380" cy="180" r="12" fill="#111" stroke="#2ecc71" stroke-width="2"/>
    <text x="380" y="185" fill="#2ecc71">A</text>
  </g>

  <!-- Central Buttons -->
  <!-- Xbox Home Button -->
  <circle cx="256" cy="110" r="22" fill="#fff" opacity="0.9" filter="url(#glow)"/>
  <path d="M256,110 m-12,-12 l24,24 m-24,0 l24,-24" stroke="#ddd" stroke-width="4" stroke-linecap="round" opacity="0.2"/>
  <path d="M246,100 L266,120 M266,100 L246,120" stroke="#333" stroke-width="3"/>

  <!-- View Button (Left Center) -->
  <circle cx="210" cy="150" r="6" fill="#111"/>
  
  <!-- Menu Button (Right Center) -->
  <circle cx="302" cy="150" r="6" fill="#111"/>
  
  <!-- Share Button (Center) -->
  <rect x="251" y="160" width="10" height="14" rx="4" fill="#111"/>

</svg>